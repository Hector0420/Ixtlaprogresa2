<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partido Político - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-white text-gray-900">
    <!-- Header -->
    <nav class="bg-white shadow-sm border-b border-gray-200" id="navbar"></nav>

    <!-- Contenido principal -->
    <main class="max-w-5xl mx-auto px-4 py-12">
        <section class="text-center mb-16">
            <h1 class="text-5xl font-extrabold text-blue-900 mb-4">Construyendo el futuro juntos</h1>
            <p class="text-lg text-gray-600 max-w-2xl mx-auto">
                Somos un partido comprometido con la transparencia, la inclusión y el desarrollo sostenible.
            </p>
        </section>

        <section>
            <h2 class="text-3xl font-bold text-blue-800 mb-8">Últimas acciones</h2>
            <div id="actions-container" class="grid gap-6 md:grid-cols-3">
                <!-- Se llena con JS -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-50 border-t border-gray-200 text-center py-6 text-sm text-gray-600" id="footer"></footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Cargar acciones al iniciar
        async function loadActions() {
            const { data, error } = await supabase
                .from('actions')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(3);
            const container = document.getElementById('actions-container');
            if (data && data.length > 0) {
                container.innerHTML = data.map(action => `
                    <div class="border border-gray-200 rounded-lg p-6 hover:shadow-md transition">
                        ${action.image_url ? `<img src="${action.image_url}" alt="${action.title}" class="w-full h-40 object-cover rounded mb-4">` : ''}
                        <h3 class="text-xl font-semibold text-blue-900 mb-2">${action.title}</h3>
                        <p class="text-gray-600 text-sm">${action.content}</p>
                        <p class="text-xs text-gray-400 mt-2">${new Date(action.created_at).toLocaleDateString()}</p>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<p class="text-gray-500 col-span-3">No hay acciones por el momento.</p>';
            }
        }

        // Cargar navbar y footer comunes
        async function loadLayout() {
            const { user } = await getUser();
            document.getElementById('navbar').innerHTML = `
                <div class="max-w-7xl mx-auto px-4 flex justify-between h-16 items-center">
                    <a href="index.html" class="text-xl font-bold text-blue-900">Partido Político</a>
                    <div class="flex gap-6 items-center text-sm font-medium">
                        <a href="index.html" class="hover:text-blue-600">Inicio</a>
                        <a href="militants.html" class="hover:text-blue-600">Militantes</a>
                        <a href="donate.html" class="hover:text-blue-600">Donar</a>
                        ${user ? `
                            ${user.user_metadata?.is_admin ? '<a href="admin.html" class="text-red-500 hover:text-red-700">Admin</a>' : ''}
                            <span class="text-gray-500">${user.email}</span>
                            <a href="#" onclick="logout()" class="text-gray-700 hover:text-red-500">Salir</a>
                        ` : `
                            <a href="login.html" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Ingresar</a>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('footer').innerHTML = `
                © ${new Date().getFullYear()} Partido Político. Todos los derechos reservados.
            `;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await loadLayout();
            await loadActions();
            // Registrar pageview
            gtag('config', '<?php echo GA_MEASUREMENT_ID; ?>', { page_path: window.location.pathname });
        });
    </script>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=<?php echo GA_MEASUREMENT_ID; ?>"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', '<?php echo GA_MEASUREMENT_ID; ?>');
    </script>
</body>
</html>
